name: Validate CloudPE

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python runtime and development tools
        run: |
          python -m pip install -r requirements-lock.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Verify examples and Python tests
        run: |
          python scripts/verify_examples.py
          python -m pytest -q
          ruff check cloudpe scripts tests
          ruff format --check cloudpe scripts tests
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
